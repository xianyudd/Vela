name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Restore, build, test, coverage
    runs-on: windows-latest
    # The job normally finishes in under two minutes. Without a limit GitHub
    # waits six hours, so a test host that fails to exit -- the coverage step
    # once sat on one for 29 minutes before it was cancelled by hand -- burns a
    # runner all afternoon and leaves the pull request reporting "pending"
    # rather than failing. Twenty minutes is far above any healthy run.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        shell: pwsh
        run: >-
          dotnet restore .\Vela.sln -r win-x64 --locked-mode
          --ignore-failed-sources
          -p:EnableRuntimePackDownload=false
          -p:DisableTransitiveFrameworkReferenceDownloads=true

      - name: Build Release
        shell: pwsh
        run: dotnet build .\Vela.sln -c Release --no-restore --nologo

      - name: Run tests
        shell: pwsh
        run: >-
          dotnet test .\Vela.sln -c Release --no-build --no-restore --nologo
          --logger "trx;LogFileName=all-tests.trx"
          --results-directory .\artifacts\test-results

      - name: Collect coverage
        shell: pwsh
        run: >-
          dotnet test .\tests\Vela.Tests\Vela.Tests.csproj -c Release
          --no-build --no-restore --nologo
          -p:CollectCoverage=true
          -p:CoverletOutput=.\..\..\artifacts\coverage\coverage
          -p:CoverletOutputFormat=cobertura
          -p:Include="[Vela.Core]*%2C[Vela.Windows]*%2C[Vela.Application]*%2C[Vela.Tui]*"
          -p:ExcludeByFile="**/Program.cs"

      - name: Verify coverage gate
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\Verify-Coverage.ps1

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-results-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            artifacts/test-results
            artifacts/coverage/coverage.cobertura.xml
